<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pincode Explorer - Your Papercraft Journey</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="icon.png">

    <!-- External Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scene">
    <div class="background-scroller"></div>
    <img src="IMG-20260708-WA0006-removebg-preview.png" class="truck" alt="Truck">
</div>

<div class="content-overlay">
  <nav class="navbar navbar-expand-lg bg-transparent">
    <div class="container">
        <span class="navbar-brand fw-bold" style="color:#2d5038;">
            <i class="bi bi-mailbox"></i>
            PINCODE EXPLORER
        </span>
    </div>
</nav>

    <div class="main-layout">
        <div class="center-section">
            <div class="search-card">
                <button class="toggle-btn" id="modeToggle">I don't know my PIN Code</button>
                
                <div id="pinInputGroup">
                    <div class="input-group">
                        <input type="text" id="pincode" class="form-control" placeholder="Enter 6-digit PIN" maxlength="6">
                        <button class="btn btn-search" onclick="searchByPin()">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </div>

                <div id="areaInputGroup" style="display: none;">
                    <select id="stateSelect" class="form-select mb-2 rounded-pill px-3 shadow-sm">
                        <option value="">Select State</option>
                        <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                        <option value="Assam">Assam</option>
                        <option value="Bihar">Bihar</option>
                        <option value="Chhattisgarh">Chhattisgarh</option>
                        <option value="Goa">Goa</option>
                        <option value="Gujarat">Gujarat</option>
                        <option value="Haryana">Haryana</option>
                        <option value="Himachal Pradesh">Himachal Pradesh</option>
                        <option value="Jharkhand">Jharkhand</option>
                        <option value="Karnataka">Karnataka</option>
                        <option value="Kerala">Kerala</option>
                        <option value="Madhya Pradesh">Madhya Pradesh</option>
                        <option value="Maharashtra">Maharashtra</option>
                        <option value="Manipur">Manipur</option>
                        <option value="Meghalaya">Meghalaya</option>
                        <option value="Mizoram">Mizoram</option>
                        <option value="Nagaland">Nagaland</option>
                        <option value="Odisha">Odisha</option>
                        <option value="Punjab">Punjab</option>
                        <option value="Rajasthan">Rajasthan</option>
                        <option value="Sikkim">Sikkim</option>
                        <option value="Tamil Nadu">Tamil Nadu</option>
                        <option value="Telangana">Telangana</option>
                        <option value="Tripura">Tripura</option>
                        <option value="Uttar Pradesh">Uttar Pradesh</option>
                        <option value="Uttarakhand">Uttarakhand</option>
                        <option value="West Bengal">West Bengal</option>
                    </select>
                    <input type="text" id="areaName" class="form-control mb-2 border rounded-pill px-3" placeholder="Enter Area / Post Office Name">
                    <button class="btn btn-search w-100" onclick="searchByArea()">Find PIN Code</button>
                </div>

                <!-- Recent Searches Panel - ONLY PINCODES -->
                <div id="recentSearchPanel" class="recent-panel" style="display: none;">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="m-0 fw-bold" style="font-size: 0.75rem; color: #888;">🕒 RECENT</h6>
                        <span class="clear-history" onclick="clearHistory()">Clear History</span>
                    </div>
                    <div id="recentSearchList"></div>
                </div>
            </div>

            <div id="resultsWrapper"></div>
        </div>

        <div class="right-section">
            <div id="landmarkContainer" class="landmark-container">
                <img id="landmarkImg" src="" alt="Famous Place" class="landmark-img">
                <div class="landmark-content">
                    <small class="text-muted text-uppercase fw-bold">Nearby Famous Place</small>
                    <h5 id="landmarkTitle" class="fw-bold mt-1" style="color: var(--ghibli-green);"></h5>
                    <p id="landmarkDesc" class="small text-muted mb-0"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- External JavaScript -->
<script src="script.js"></script>
<footer class="ghibli-footer">
    <div class="footer-content">
        <!-- Secret India Post Easter Egg Icon -->
        <a href="https://www.indiapost.gov.in/" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="footer-easter-egg" 
           title="Official India Post Portal">
            📬
        </a>

        <div class="footer-brand">
            <span>PINCode Explorer</span>
        </div>
        <p class="footer-tagline">Crafted with paper, code, and memories.</p>
        <div class="footer-links">
            <span>Presented by <strong>Rishabh Jain</strong> & </span>
        </div>
        <div class="footer-copyright">
            <small>© 2026 PINCode Explorer. All rights reserved.</small>
        </div>
    </div>
</footer>
</body>
</html>
